---
# Ansible Galaxy collections and roles to install into the EE
# Docs: https://docs.ansible.com/ansible/latest/galaxy/user_guide.html#install-multiple-collections-with-a-requirements-file
collections:
  # Automation Development Office collection (release artifact)
  - name: infra.ado
    type: url
    source: https://github.com/Automation-Development-Office/ado/releases/download/1.0.0/infra-ado-1.0.0.tar.gz
  # Declared dependency of infra.ado; installed from Ansible Galaxy
  - name: ansible.utils
roles: []

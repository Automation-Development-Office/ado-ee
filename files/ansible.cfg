[defaults]
# Collections and roles installed into the EE live under /usr/share/ansible
collections_path = /usr/share/ansible/collections
roles_path = /usr/share/ansible/roles

[galaxy]
# Prefer Red Hat Automation Hub (certified then validated), then Ansible Galaxy.
server_list = rh_published, rh_validated, galaxy

[galaxy_server.rh_published]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
# Replaced at image build time from BuildKit/Podman secret "automation_hub_token" (galaxy stage only).
token = __AUTOMATION_HUB_TOKEN__

[galaxy_server.rh_validated]
url = https://console.redhat.com/api/automation-hub/content/validated/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
token = __AUTOMATION_HUB_TOKEN__

[galaxy_server.galaxy]
url = https://galaxy.ansible.com/

name: Test Execution Environment Build

# Builds and inspects the EE without publishing to GHCR.
# Publishing only happens from the release workflow (build-ee.yml).
on:
  push:
    branches: [main]
    paths:
      - "execution-environment.yml"
      - "requirements.yml"
      - "requirements.txt"
      - "bindep.txt"
      - "files/**"
      - ".github/workflows/test-ee.yml"
  pull_request:
    paths:
      - "execution-environment.yml"
      - "requirements.yml"
      - "requirements.txt"
      - "bindep.txt"
      - "files/**"
      - ".github/workflows/test-ee.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_IMAGE: ado-ee:ci-test
  RH_REGISTRY_USERNAME: ${{ secrets.RH_REGISTRY_USERNAME }}
  RH_REGISTRY_TOKEN: ${{ secrets.RH_REGISTRY_TOKEN }}
  AUTOMATION_HUB_TOKEN: ${{ secrets.AUTOMATION_HUB_TOKEN }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-builder
        run: |
          python -m pip install --upgrade pip
          pip install ansible-builder

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Require Red Hat registry credentials
        run: |
          if [ -z "${RH_REGISTRY_USERNAME}" ] || [ -z "${RH_REGISTRY_TOKEN}" ]; then
            echo "::error::RH_REGISTRY_USERNAME and RH_REGISTRY_TOKEN secrets are required to pull the AAP base image from registry.redhat.io"
            echo "Create a registry service account at https://access.redhat.com/terms-based-registry and add both secrets to this repository."
            exit 1
          fi
          if [ -z "${AUTOMATION_HUB_TOKEN}" ]; then
            echo "::error::AUTOMATION_HUB_TOKEN secret is required to install certified/validated collections from console.redhat.com Automation Hub"
            echo "Create a token at https://console.redhat.com/ansible/automation-hub/token and add it as AUTOMATION_HUB_TOKEN."
            exit 1
          fi

      - name: Log in to Red Hat Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ env.RH_REGISTRY_USERNAME }}
          password: ${{ env.RH_REGISTRY_TOKEN }}

      - name: Create build context
        run: |
          ansible-builder create \
            -f execution-environment.yml \
            --output-filename Dockerfile

      - name: Build Execution Environment (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./context
          file: ./context/Dockerfile
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            AUTOMATION_HUB_TOKEN=${{ secrets.AUTOMATION_HUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Collect EE information
        id: info
        run: |
          set -euo pipefail

          IMAGE="${{ env.LOCAL_IMAGE }}"
          mkdir -p /tmp/ee-report

          # Image metadata
          docker image inspect "$IMAGE" \
            --format '{{json .}}' > /tmp/ee-report/inspect.json

          SIZE_BYTES=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          SIZE_HUMAN=$(numfmt --to=iec --suffix=B "$SIZE_BYTES")
          CREATED=$(docker image inspect "$IMAGE" --format '{{.Created}}')
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' 2>/dev/null || true)
          IMAGE_ID=$(docker image inspect "$IMAGE" --format '{{.Id}}')

          # Runtime probes
          docker run --rm "$IMAGE" ansible --version > /tmp/ee-report/ansible-version.txt
          docker run --rm "$IMAGE" ansible-runner --version > /tmp/ee-report/ansible-runner-version.txt
          docker run --rm "$IMAGE" ansible-galaxy collection list > /tmp/ee-report/collections.txt

          # Verify required collections and versions
          fail=0
          expected_collections=(
            "infra.ado=1.0.0"
            "ansible.controller=4.6.19"
            "ansible.hub=1.0.6"
            "awx.awx=24.6.1"
            "community.general=13.1.0"
            "infra.aap_configuration=3.4.1"
            "infra.controller_configuration=3.1.2"
          )
          for entry in "${expected_collections[@]}"; do
            name="${entry%%=*}"
            version="${entry#*=}"
            name_re="${name//./\\.}"
            if ! grep -E "^${name_re}[[:space:]]+${version}([[:space:]]|$)" /tmp/ee-report/collections.txt; then
              echo "::error::Expected collection ${name} ${version} was not found in the built EE"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Installed collections:"
            cat /tmp/ee-report/collections.txt
            exit 1
          fi

          # Base image from definition
          BASE_IMAGE="$(python3 -c 'import yaml; print(yaml.safe_load(open("execution-environment.yml"))["images"]["base_image"]["name"])')"

          {
            echo "size_human=${SIZE_HUMAN}"
            echo "size_bytes=${SIZE_BYTES}"
            echo "created=${CREATED}"
            echo "image_id=${IMAGE_ID}"
            echo "base_image=${BASE_IMAGE}"
          } >> "$GITHUB_OUTPUT"

          echo "EE test build succeeded (${SIZE_HUMAN})"

      - name: Write job summary
        run: |
          {
            echo "## Execution Environment test build"
            echo ""
            echo "Local-only build — **not** published to GHCR."
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Local tag | \`${{ env.LOCAL_IMAGE }}\` |"
            echo "| Base image | \`${{ steps.info.outputs.base_image }}\` |"
            echo "| Image ID | \`${{ steps.info.outputs.image_id }}\` |"
            echo "| Image size | ${{ steps.info.outputs.size_human }} |"
            echo "| Created | ${{ steps.info.outputs.created }} |"
            echo "| Build digest | \`${{ steps.build.outputs.digest }}\` |"
            echo ""
            echo "### ansible --version"
            echo ""
            echo '```'
            cat /tmp/ee-report/ansible-version.txt
            echo '```'
            echo ""
            echo "### ansible-runner --version"
            echo ""
            echo '```'
            cat /tmp/ee-report/ansible-runner-version.txt
            echo '```'
            echo ""
            echo "### Installed collections"
            echo ""
            echo '```'
            cat /tmp/ee-report/collections.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EE report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ee-test-report
          path: /tmp/ee-report/
          if-no-files-found: error
          retention-days: 14
